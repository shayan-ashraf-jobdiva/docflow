<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocFlow</title>
<style>
  :root { --bg:#f5f6f3; --fg:#17211c; --muted:#58675f; --line:#cfd5cf; --accent:#1d6b58; --card:#fbfcfa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101614; --fg:#e6ede9; --muted:#9db0a6; --line:#2c3832; --accent:#5fcfb0; --card:#171f1b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  h1 { margin:0; font-size:1.8rem; }
  p.sub { margin:4px 0 0; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  input, button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { background:var(--accent); color:var(--bg); border-color:var(--accent); cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .badge { font:600 12px ui-monospace, monospace; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .DONE { color:var(--accent); border-color:var(--accent); }
  .FAILED { color:#c0392b; border-color:#c0392b; }
  .RETRYING, .PROCESSING, .QUEUED { color:#b4701d; border-color:#b4701d; }
  .muted { color:var(--muted); font-size:13px; }
  #msg { min-height:1.4em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>DocFlow <small id="ver" style="font-size:.5em;font-weight:400;opacity:.7"></small></h1>
    <p class="sub">Upload an invoice (.txt, .csv or .pdf). It is processed in the background and the result appears below.</p>
  </header>
  <div class="card">
    <label>User <input id="user" value="demo" size="10" maxlength="32"></label>
    <input id="file" type="file" accept=".txt,.csv,.pdf">
    <button id="send">Upload</button>
    <span id="msg" class="muted"></span>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>File</th><th>Status</th><th>Result</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="muted">No documents yet.</td></tr></tbody>
    </table>
  </div>
  <section>
    <h2 style="font-size:1rem;margin:0 0 8px">Email notifications</h2>
    <div id="mail" class="muted">None yet.</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const auth = () => ({ Authorization: "Bearer demo:" + $("user").value.trim().toLowerCase() });
$("user").value = localStorage.getItem("docflowUser") || "demo";

function cell(tr, text, cls) {
  const td = document.createElement("td");
  if (cls) { const s = document.createElement("span"); s.className = "badge " + cls; s.textContent = text; td.appendChild(s); }
  else td.textContent = text;
  tr.appendChild(td); return td;
}

async function refresh() {
  try {
    const r = await fetch("/jobs", { headers: auth() });
    if (!r.ok) { $("msg").textContent = "Sign-in problem: use letters, digits, - or _ for the user name."; return; }
    const jobs = await r.json();
    const body = $("rows"); body.replaceChildren();
    if (!jobs.length) { body.innerHTML = '<tr><td colspan="3" class="muted">No documents yet.</td></tr>'; }
    for (const j of jobs) {
      const tr = document.createElement("tr");
      cell(tr, j.filename);
      cell(tr, j.status, j.status);
      let t = "";
      if (j.result) t = `${j.result.vendor} · ${j.result.invoice_number || "no number"} · ${j.result.date || "no date"} · total ${j.result.total.toFixed(2)}`;
      else if (j.error) t = j.error;
      cell(tr, t).className = "muted";
      body.appendChild(tr);
    }
    const m = await (await fetch("/notifications", { headers: auth() })).json();
    $("mail").replaceChildren(...(m.length ? m.map(x => { const d = document.createElement("div"); d.textContent = x.subject; return d; }) : ["None yet."]));
  } catch (e) { $("msg").textContent = "Could not reach the server."; }
}

$("send").onclick = async () => {
  const f = $("file").files[0];
  if (!f) { $("msg").textContent = "Choose a file first."; return; }
  localStorage.setItem("docflowUser", $("user").value);
  $("send").disabled = true; $("msg").textContent = "Uploading...";
  try {
    const r = await fetch("/jobs", { method: "POST", headers: { ...auth(), "Content-Type": "application/json" }, body: JSON.stringify({ filename: f.name }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Request failed");
    const u = await fetch(j.upload_url, { method: "PUT", body: f });
    if (!u.ok) throw new Error((await u.json()).detail || "Upload failed");
    $("msg").textContent = "Uploaded. Processing in the background.";
    $("file").value = "";
  } catch (e) { $("msg").textContent = e.message; }
  $("send").disabled = false; refresh();
};

refresh(); setInterval(refresh, 2000);
</script>
<script>fetch("/health").then(r=>r.json()).then(h=>{document.getElementById("ver").textContent="v"+h.version}).catch(()=>{});</script>
</body>
</html>
